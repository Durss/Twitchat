name: Build and publish Docker image

on:
    push:
        branches: [main, beta]
        tags: ["v*"]
    pull_request: {}
    workflow_dispatch: {}

env:
    REGISTRY: ghcr.io
    IMAGE_NAME: ${{ github.repository }} # Durss/Twitchat -> ghcr.io/durss/twitchat (lowercased by metadata-action)

jobs:
    test:
        runs-on: ubuntu-latest
        permissions:
            contents: read

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up Node
              uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm

            # tmi.js and vue-select are pinned to git+ssh:// URLs in the lockfile and
            # there's no SSH key on the runner: force HTTPS for these public repos.
            # --add is required, a second plain `git config` would overwrite the first rewrite.
            - name: Rewrite GitHub SSH URLs to HTTPS
              run: |
                  git config --global --add url."https://github.com/".insteadOf "ssh://git@github.com/"
                  git config --global --add url."https://github.com/".insteadOf "git@github.com:"

            - name: Install dependencies
              run: npm ci

            - name: Run tests
              run: npm test

    build-and-push:
        needs: test
        # PRs only get tested, never published
        if: github.event_name != 'pull_request'
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write # required to push to GHCR with GITHUB_TOKEN

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Extract image tags and labels
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
                  tags: |
                      type=raw,value=latest,enable={{is_default_branch}}
                      type=ref,event=branch
                      type=semver,pattern={{version}}
                      type=semver,pattern={{major}}.{{minor}}
                      type=sha,format=short

            - name: Build and push
              uses: docker/build-push-action@v6
              with:
                  context: .
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  provenance: false # single-arch deploy: keep the package manifest clean
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
