<!doctype html>
<html lang="en">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<meta name="robots" content="noindex" />
	<link rel="icon" type="image/png" sizes="32x32" href="/favicon.png?v=1" />
	<title>Twitchat - Maintenance</title>
	<style>
		:root {
			--color-text: #eeeeee;
			--color-text-fade: rgba(238, 238, 238, 0.5);
			--color-primary-fader: rgba(0, 134, 103, 0.4);
			--color-secondary: #e04e00;
			--color-secondary-light: #ff7023;
			--color-secondary-extralight: #ffa87a;
			--background-color-fader: rgba(255, 255, 255, 0.15);
			--background-color-fadest: rgba(255, 255, 255, 0.05);
			--border-radius: 0.5rem;
		}

		body.light {
			--color-text: #101010;
			--color-text-fade: rgba(16, 16, 16, 0.5);
			--color-primary-fader: rgba(3, 147, 114, 0.4);
			--background-color-fader: rgba(0, 0, 0, 0.15);
			--background-color-fadest: rgba(0, 0, 0, 0.075);
		}

		* {
			box-sizing: border-box;
		}

		body {
			margin: 0;
			padding: 0;
			-webkit-font-smoothing: antialiased;
			-moz-osx-font-smoothing: grayscale;
			font-family: Inter, Helvetica, Arial, sans-serif;
			color: var(--color-text);
			background-color: #18181b;
		}

		body.light {
			background-color: #ffffff;
		}

		a {
			color: var(--color-secondary-light);
		}

		a:hover {
			color: var(--color-secondary-extralight);
		}

		body.light a {
			color: var(--color-secondary);
		}

		body.light a:hover {
			color: var(--color-secondary-light);
		}

		.home-gradient-bg {
			background: linear-gradient(180deg, var(--color-primary-fader) 0%, transparent 100%);
			width: 100%;
			height: 100vh;
			position: absolute;
			top: 0;
			left: 0;
		}

		.holder {
			position: fixed;
			top: 50%;
			left: 50%;
			transform: translate(-50%, -50%);
			z-index: 1;
			display: flex;
			flex-direction: column;
			gap: 1em;
			width: 380px;
			max-width: 100vw;
			max-height: 100vh;
			overflow-y: auto;
			padding: 0.5em;
			border-radius: 0.5em;
			backdrop-filter: blur(10px);
			background: linear-gradient(180deg,
					rgba(0, 0, 0, 0.7) 0%,
					rgba(0, 0, 0, 0.85) 50%,
					rgba(0, 0, 0, 0.7) 100%);
			box-shadow: 0px 0px 10px 2px rgba(0, 0, 0, 0.5);
		}

		body.light .holder {
			background: linear-gradient(180deg,
					rgba(255, 255, 255, 0.5) 0%,
					rgba(255, 255, 255, 0.6) 50%,
					rgba(255, 255, 255, 0.5) 100%);
		}

		.holder>.head {
			align-self: center;
			padding-top: 20px;
			gap: 10px;
			display: flex;
			align-items: center;
		}

		.holder>.head>span {
			font-size: 2.5em;
			margin-top: -10px;
		}

		.holder>.head>.icon {
			height: 50px;
		}

		.holder>.content {
			display: flex;
			flex-direction: column;
			align-items: center;
			gap: 1em;
			text-align: center;
			line-height: 1.5em;
		}

		.holder>.content>.title {
			font-size: 1.25em;
			font-weight: bold;
		}

		.holder>.content>.quote {
			font-style: italic;
			word-break: break-word;
			line-height: 1.2em;
			border-radius: var(--border-radius);
			border-left: 2px solid var(--background-color-fader);
			background-image: linear-gradient(90deg,
					var(--background-color-fadest),
					transparent);
			padding: 0.5em;
			text-align: left;
			line-height: 1.2em;
		}

		.holder>.content>.quote.hidden {
			display: none;
		}

		.holder>.content>.quote>svg {
			width: 1em;
			height: 1em;
			display: inline-block;
			margin-right: .25em;
		}

		.holder>.content>.quote>span {
			white-space: pre-line;
		}

		.holder>.content>.discord-link>svg {
			display: inline-block;
			height: 1em;
			width: 1em;
			margin-right: .25em;
			vertical-align: middle;
			color: var(--color-secondary);
		}

		.holder>.content>.admin-link {
			font-weight: bold;
		}

		.holder>.content>.admin-link.hidden {
			display: none;
		}

		.holder>.content>.spinner {
			width: 30px;
			height: 30px;
			display: block;
		}

		body.light .holder>.content>.spinner {
			filter: invert();
		}

		.holder>.content>.status-holder {
			gap: 5px;
			display: flex;
			flex-direction: row;
			align-items: center;
		}

		.holder>.content>.status-holder>.status {
			font-size: 0.8em;
			color: var(--color-text-fade);
			white-space: pre-line;
		}

		.holder>.content>.status-holder>.spinner {
			height: .8em;
			opacity: 0;
			width: 0;
			margin-left: -5px;
			transition: all .25s;
		}

		.holder>.content>.status-holder>.spinner.visible {
			opacity: 1;
			margin-left: 0;
			width: .8em;
		}
	</style>
</head>

		try {
			let theme = localStorage.getItem("twitchat_theme");
			//Apply theme from storage
			if (theme) {
				document.body.classList.add(theme === "light" ? "light" : "dark");
			} else if (matchMedia("(prefers-color-scheme: light)").matches) {
				//Apply theme from browser pref
				document.body.classList.add("light");
			} else {
				document.body.classList.add("dark");
			}
		} catch (error) {
			console.log(error);
		}

	<script type="text/javascript">
		const POLL_INTERVAL = 10000;
		//Random offset so clients don't all poll at the same time
		const POLL_OFFSET = Math.random() * 5000;
		//Max random delay before going back so users don't all hit the server at once
		const MAX_RETURN_DELAY = 30000;
		const REQUEST_TIMEOUT = 8000;

		const labels = {
			en: {
				title: "Maintenance",
				description:
					"This page will automatically refresh once maintainance completes.",
				lastCheck: "Last check: {TIME}",
				back: "Maintenance is over!\nGoing back to Twitchat in {SECONDS}s...",
				discord: "Join Discord for updates",
				admin: "🔐 go back to Twitchat",
			},
			fr: {
				title: "Maintenance",
				description:
					"La page se rafraichira automatiquement une fois la maintenance terminée.",
				lastCheck: "Dernière vérification : {TIME}",
				back: "Maintenance terminée dans {SECONDS}s...",
				discord: "Suivez l'avancement sur Discord",
				admin: "🔐 retour sur Twitchat",
			},
		};
		//Same language as the app: the one picked in its settings, or the browser's
		let lang = (navigator.language || "en").substring(0, 2).toLowerCase();
		try {
			lang = localStorage.getItem("twitchat_lang") || lang;
		} catch (error) {}
		if (!labels[lang]) lang = "en";
		const t = labels[lang];
		document.documentElement.lang = lang;
		document.title = "Twitchat - " + t.title;
		document.getElementById("title").innerText = "🚧 "+t.title+" 🚧";
		document.getElementById("description").innerText = t.description;
		document.getElementById("discord").innerText = t.discord;

		const statusHolder = document.getElementById("status");
		const quoteHolder = document.getElementById("quote");
		const messageHolder = document.getElementById("message");
		const adminLink = document.getElementById("admin");
		const spinner = document.querySelector(".spinner");
		let firstPoll = true;

		/**
		 * Get the page to go back to.
		 * Only accept relative paths, "//host" and "/\host" would send
		 * the user to another website.
		 */
		function getReturnPath() {
			const from = new URLSearchParams(document.location.search).get("from") || "";
			if (!/^\/(?![\/\\])/.test(from) || /^\/maintenance/i.test(from)) return "/chat";
			return from;
		}

		/**
		 * Get the message in user's language, english as a fallback
		 */
		function getMessage(message) {
			return message?.[lang] || message?.en || "";
		}

		/**
		 * Go back to the app after the given delay
		 */
		function goBack(delay) {
			const end = Date.now() + delay;
			const tick = () => {
				const remaining = Math.max(0, Math.ceil((end - Date.now()) / 1000));
				statusHolder.innerText = t.back.replace("{SECONDS}", remaining);
				if (remaining <= 0) {
					document.location.href = getReturnPath();
					return;
				}
				setTimeout(tick, 250);
			};
			tick();
		}

		/**
		 * Check maintenance status.
		 * Only an explicit "off" state sends the user back. Network errors,
		 * timeouts, 5xx and non-JSON responses (proxy error pages) all mean
		 * "stay", otherwise a server that's down would send users back to
		 * a broken app.
		 */
		async function poll() {
			spinner.classList.add("visible");
			const controller = new AbortController();
			const timeout = setTimeout(() => controller.abort(), REQUEST_TIMEOUT);
			try {
				const res = await fetch("/api/maintenance/status", {
					cache: "no-store",
					signal: controller.signal,
				});
				const json = res.ok ? await res.json() : null;
				const data = json?.success === true ? json.data : null;
				if (data?.state === "off") {
					//No need to wait if maintenance was already over when opening the page
					goBack(firstPoll ? 0 : Math.random() * MAX_RETURN_DELAY);
					return;
				}
				const message = getMessage(data?.message);
				messageHolder.innerText = message;
				quoteHolder.classList.toggle("hidden", !message);
			} catch (error) {
				//Server unreachable, try again later
			} finally {
				clearTimeout(timeout);
			}

			firstPoll = false;
			statusHolder.innerText = t.lastCheck.replace("{TIME}", new Date().toLocaleTimeString());
			setTimeout(poll, POLL_INTERVAL + POLL_OFFSET);
			setTimeout(() => {
				spinner.classList.remove("visible");
			}, 1000);
		}

		/**
		 * Admins keep access to the app during maintenance.
		 * The server recognizes their page loads by a cookie its admin
		 * endpoints set, this gets it from the app's Twitch token (same
		 * origin storage) so an admin without the cookie can get back in.
		 */
		async function checkAdmin() {
			let token = "";
			try {
				const auth = JSON.parse(localStorage.getItem("twitchat_oAuthToken") || "{}");
				token = auth.access_token || "";
			} catch (error) {}
			if (!token) return;
			try {
				const res = await fetch("/api/admin/maintenance", {
					cache: "no-store",
					headers: { Authorization: "Bearer " + token },
				});
				if (res.status != 200) return;
				adminLink.innerText = t.admin;
				adminLink.href = getReturnPath();
				adminLink.classList.remove("hidden");
			} catch (error) {
				//Not an admin or server unreachable, nothing to show
			}
		}

		poll();
		checkAdmin();
	</script>
